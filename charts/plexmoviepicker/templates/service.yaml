apiVersion: v1
kind: Service
metadata:
  name: {{ include "plexmoviepicker.fullname" . }}
  labels:
    {{- include "plexmoviepicker.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "plexmoviepicker.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
